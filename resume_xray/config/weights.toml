# Every threshold and weight used by resume-xray.
# Names match ALGORITHM.md; see that file for the justification of each value.
# tests/test_config.py fails if this file and ALGORITHM.md disagree.

[reader]
# 2.0 A word joins a row when overlap / min(word height, row height) is at least this.
row_overlap_min = 0.5

[parseability]
# 2.1 Text layer: fewer characters than this on a page means a scanned image.
min_chars_per_page = 50

# 2.2 Garbled character ratio (cid glyphs, U+FFFD, private use area).
garbled_warn = 0.02
garbled_critical = 0.10

# 2.3 Multi-column detection: a vertical whitespace gutter.
gutter_min_width_pt = 15
gutter_max_coverage = 0.05
gutter_min_height = 0.5
gutter_x_range = [0.2, 0.8]

# 2.4 A reading whose word order is less similar than this to the column-aware reading is scrambled.
agreement_order_max = 0.85

# 2.6 Section heading detection.
heading_max_words = 4
heading_size_ratio = 1.15
heading_match_min = 85

# 2.7 A phone number has this many digits (national numbers up to the E.164 maximum).
phone_min_digits = 10
phone_max_digits = 15

# 2.8 A leading bullet smaller than this fraction of the line's font size is misaligned.
bullet_size_ratio = 0.5

[match]
# 3.3 Requirement factor r_t.
required_weight = 1.0
preferred_weight = 0.5

# 3.4 Match level m_t when the resume uses another form of the job's word (managed / management).
word_form_match = 0.5

# 3.4 Match level m_t when only a synonym is present.
synonym_match = 0.5

# 3.2 The job's first line is its title only if it has at most this many words.
title_max_words = 8

# 3.4 A one-word wording matches another form of the word only if their lengths differ by at most
# this many letters (roadmap / roadmaps, but not Excel / Excellent).
word_form_max_extra = 2
