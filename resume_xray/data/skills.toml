# Skill dictionary used by job matching (ALGORITHM.md §3.2). Maintained by the project from industry
# usage; entries carry no external source.
#
# Synonyms rule: two wordings share an entry only if a recruiter could search for one instead of
# the other: an abbreviation (K8s), a translation (Proje Yönetimi), a spelling variant (Postgres) or
# a renamed product. Parts of a skill, versions and related but different skills (UI and UX, Scrum
# and Agile) get entries of their own.
# Key: canonical name. Value: every wording that means the same skill; the first one is shown to
# users. Wordings of one or two characters (R, C, Go, UI, ML) only match with the same capitals,
# so that ordinary words are not taken for skills. A longer wording that is also an ordinary word
# can be marked the same way with a leading "=": "=GEO" matches GEO but not geo. A resume that uses a different wording than the job description gets partial credit
# (synonym_match), because a recruiter's keyword search for the job's wording would miss it.
# Hand-curated starting list; contributions welcome.

